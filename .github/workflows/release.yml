name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Validate version and main ancestry
        run: |
          node -e 'const p=require("./package.json"); if(process.env.GITHUB_REF_NAME!=="v"+p.version) throw Error("Tag must match package.json version");'
          git merge-base --is-ancestor HEAD origin/main
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run package:vsix
      - name: Verify and checksum package
        run: |
          unzip -q dsh-vscode-native-*.vsix -d "$RUNNER_TEMP/vsix-check"
          node tests/verify-package.cjs "$RUNNER_TEMP/vsix-check/extension"
          sha256sum dsh-vscode-native-*.vsix > SHA256SUMS.txt
      - name: Publish GitHub Release (not Marketplace)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dsh-vscode-native-*.vsix SHA256SUMS.txt \
            --verify-tag --title "DeepSeek Harness Native $GITHUB_REF_NAME" --generate-notes
